app:
  name: nufi
  version: "0.1.0"
  imageTag: "0.1.0"
  runtime: python-3.13

dataModel:
  version: "data-model-2026.04"
  migrationSource: django-migrations
  activeApps:
    - accounts
    - categories
    - bank_accounts
    - income
    - expenses
    - budgets
    - alerts
    - reports
    - debts
    - sharing

pipelines:
  version: "pipeline-2026.04"
  jobs:
    dailySummary:
      command: "python manage.py daily_summary"
      schedule: "5 0 * * *"
      output: "generated_reports/daily_summary_YYYY-MM-DD.json"
    budgetAlertCheck:
      command: "python manage.py budget_alert_check"
      schedule: "*/30 * * * *"
      output: "alerts table"
    backupAndExport:
      command: "python manage.py backup_and_export"
      schedule: "30 1 * * *"
      output: "generated_reports/backup_YYYYMMDD_HHMMSS/"
    mysqlDump:
      command: "mysqldump"
      schedule: "45 1 * * *"
      output: "generated_reports/mysql/*.sql.gz"
      enabledByDefault: false
    smokeTest:
      command: "python scripts/smoke_test.py"
      schedule: "0 2 * * *"
      output: "job status/log"

backupPolicy:
  appExportRetentionDays: 30
  sqlDumpRetentionDays: 30
  storage: persistent-volume

modelRegistry:
  note: "NUFI hiện chưa có ML model. Trường này giữ chỗ để quản lý version nếu sau này thêm mô hình dự báo chi tiêu."
  currentModelVersion: "none"
