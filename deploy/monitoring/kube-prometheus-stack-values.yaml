grafana:
  enabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
  adminUser: admin
  adminPassword: admin

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    probeNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    retention: 7d

alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: local-default
      group_by:
        - namespace
        - alertname
        - severity
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        - receiver: local-critical
          matchers:
            - severity="critical"
          continue: true
        - receiver: local-warning
          matchers:
            - severity="warning"
          continue: true
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity="warning"
        equal:
          - namespace
          - alertname
    receivers:
      - name: local-default
      - name: local-warning
      - name: local-critical

prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
