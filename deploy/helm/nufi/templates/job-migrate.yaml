{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nufi.fullname" . }}-migrate
  labels:
    {{- include "nufi.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  {{- if .Values.migrationJob.useHelmHook }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "nufi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "nufi.serviceAccountName" . }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/entrypoint.sh"]
          args: ["python", "manage.py", "migrate", "--noinput", "--fake-initial"]
          envFrom:
            - configMapRef:
                name: {{ include "nufi.configMapName" . }}
            - secretRef:
                name: {{ include "nufi.secretName" . }}
{{- end }}
