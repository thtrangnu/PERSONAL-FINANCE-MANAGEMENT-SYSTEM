apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nufi.fullname" . }}
  labels:
    {{- include "nufi.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nufi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nufi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nufi.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nufi.configMapName" . }}
            - secretRef:
                name: {{ include "nufi.secretName" . }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: pipeline-version
              mountPath: /app/config/runtime
              readOnly: true
            - name: media
              mountPath: /app/media
            - name: reports
              mountPath: /app/generated_reports
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: 127.0.0.1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: pipeline-version
          configMap:
            name: {{ include "nufi.configMapName" . }}
            items:
              - key: pipeline-version.yaml
                path: pipeline-version.yaml
        - name: media
          {{- if .Values.persistence.media.hostPath }}
          hostPath:
            path: {{ .Values.persistence.media.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else if .Values.persistence.media.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nufi.mediaPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: reports
          {{- if .Values.persistence.reports.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nufi.reportsPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
