apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nufi.configMapName" . }}
  labels:
    {{- include "nufi.labels" . | nindent 4 }}
data:
  DEBUG: {{ .Values.env.debug | quote }}
  ALLOWED_HOSTS: {{ include "nufi.allowedHosts" . | quote }}
  DB_ENGINE: {{ .Values.externalDatabase.engine | quote }}
  DB_NAME: {{ .Values.externalDatabase.name | quote }}
  DB_USER: {{ .Values.externalDatabase.user | quote }}
  DB_HOST: {{ .Values.externalDatabase.host | quote }}
  DB_PORT: {{ .Values.externalDatabase.port | quote }}
  DB_UNIX_SOCKET: {{ .Values.externalDatabase.unixSocket | quote }}
  PORT: "8000"
  WEB_CONCURRENCY: {{ .Values.env.webConcurrency | quote }}
  GUNICORN_TIMEOUT: {{ .Values.env.gunicornTimeout | quote }}
  RUN_MIGRATIONS: "false"
  RUN_COLLECTSTATIC: "false"
  REPORT_OUTPUT_DIR: {{ .Values.env.reportOutputDir | quote }}
  GS_BUCKET_NAME: {{ .Values.env.gsBucketName | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
  MODEL_VERSION: {{ .Values.app.modelVersion | quote }}
  PIPELINE_VERSION: {{ .Values.app.pipelineVersion | quote }}
  DJANGO_SUPERUSER_USERNAME: {{ .Values.env.djangoSuperuserUsername | quote }}
  DJANGO_SUPERUSER_EMAIL: {{ .Values.env.djangoSuperuserEmail | quote }}
  pipeline-version.yaml: |
    app:
      name: nufi
      version: {{ .Values.app.version | quote }}
      image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
    dataModel:
      version: {{ .Values.app.modelVersion | quote }}
      migrationStrategy: django-migrations
    pipelines:
      version: {{ .Values.app.pipelineVersion | quote }}
      commands:
        dailySummary: python manage.py daily_summary
        budgetAlertCheck: python manage.py budget_alert_check
        backupAndExport: python manage.py backup_and_export
