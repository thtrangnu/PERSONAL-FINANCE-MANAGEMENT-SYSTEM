{{- if .Values.pipelines.dailySummary.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nufi.fullname" . }}-daily-summary
  labels:
    {{- include "nufi.labels" . | nindent 4 }}
    app.kubernetes.io/component: pipeline
    nufi.io/pipeline: daily-summary
spec:
  schedule: {{ .Values.pipelines.dailySummary.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.pipelines.dailySummary.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.pipelines.dailySummary.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "nufi.serviceAccountName" . }}
          containers:
            - name: daily-summary
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/entrypoint.sh"]
              args: ["python", "manage.py", "daily_summary"]
              envFrom:
                - configMapRef:
                    name: {{ include "nufi.configMapName" . }}
                - secretRef:
                    name: {{ include "nufi.secretName" . }}
              volumeMounts:
                - name: reports
                  mountPath: /app/generated_reports
          volumes:
            - name: reports
              {{- if .Values.persistence.reports.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "nufi.reportsPvcName" . }}
              {{- else }}
              emptyDir: {}
              {{- end }}
---
{{- end }}
