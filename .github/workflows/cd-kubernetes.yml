name: CD Kubernetes

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Kubernetes namespace
        required: true
        default: nufi
      release_name:
        description: Helm release name
        required: true
        default: nufi
      image_repository:
        description: Docker image repository visible to the cluster
        required: true
        default: nufi-web
      image_tag:
        description: Docker image tag
        required: true
        default: latest

concurrency:
  group: nufi-kubernetes-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Helm chart on self-hosted runner
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image for local cluster
        run: docker build -t "${{ inputs.image_repository }}:${{ inputs.image_tag }}" .

      - name: Deploy with Helm
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          helm upgrade --install "${{ inputs.release_name }}" deploy/helm/nufi \
            --namespace "${{ inputs.namespace }}" \
            --create-namespace \
            --set image.repository="${{ inputs.image_repository }}" \
            --set image.tag="${{ inputs.image_tag }}" \
            --set externalDatabase.name="${DB_NAME:-pfms}" \
            --set externalDatabase.user="${DB_USER:-root}" \
            --set externalDatabase.host="${DB_HOST:-host.docker.internal}" \
            --set externalDatabase.port="${DB_PORT:-3306}" \
            --set secret.secretKey="${SECRET_KEY:-django-insecure-nufi-k8s-local-change-me}" \
            --set secret.dbPassword="${DB_PASSWORD}" \
            --set secret.googleOauthClientId="${GOOGLE_OAUTH_CLIENT_ID}" \
            --set secret.googleOauthClientSecret="${GOOGLE_OAUTH_CLIENT_SECRET}"

      - name: Verify rollout
        run: |
          kubectl -n "${{ inputs.namespace }}" rollout status deployment -l app.kubernetes.io/instance="${{ inputs.release_name }}" --timeout=180s
          kubectl -n "${{ inputs.namespace }}" get pods
