name: CI

on:
  push:
    branches:
      - main

jobs:
  django-check:
    name: Django check and Docker build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: pfms_ci
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      SECRET_KEY: ci-secret-key
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DB_ENGINE: mysql
      DB_NAME: pfms_ci
      DB_USER: root
      DB_PASSWORD: root_password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      GOOGLE_OAUTH_CLIENT_ID: ""
      GOOGLE_OAUTH_CLIENT_SECRET: ""
      REPORT_OUTPUT_DIR: generated_reports

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput --fake-initial

      - name: Run scheduled jobs
        run: |
          python manage.py daily_summary
          python manage.py budget_alert_check
          python manage.py backup_and_export

      - name: Build Docker image
        run: docker build -t nufi-web:ci .
