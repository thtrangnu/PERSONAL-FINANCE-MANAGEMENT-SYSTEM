{% extends "admin/base.html" %}

{% block title %}{{ title }} | NUFI Admin{% endblock %}

{% block extrastyle %}
  {{ block.super }}
  <style>
    :root {
      --primary: #2857df;
      --secondary: #0f766e;
      --accent: #e7f7f4;
      --primary-fg: #fff;
      --body-fg: #20324d;
      --body-bg: #eef6fb;
      --body-quiet-color: #6b7890;
      --border-color: rgba(32, 50, 77, 0.12);
      --darkened-bg: #f6faf9;
      --selected-bg: #e7f7f4;
      --button-bg: #2857df;
      --button-hover-bg: #1d46c2;
      --default-button-bg: #0f766e;
      --default-button-hover-bg: #115e59;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(217, 244, 239, 0.9), transparent 26rem),
        radial-gradient(circle at top right, rgba(40, 87, 223, 0.14), transparent 24rem),
        linear-gradient(180deg, #eef6fb 0%, #ffffff 78%);
      font-family: Arial, Helvetica, sans-serif;
    }

    #header {
      min-height: 68px;
      padding: 0 34px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(32, 50, 77, 0.1);
      box-shadow: 0 18px 44px rgba(32, 50, 77, 0.08);
    }

    #branding h1,
    #branding h1 a:link,
    #branding h1 a:visited {
      color: #20324d;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    #branding h1::before {
      content: "N";
      display: inline-grid;
      width: 36px;
      height: 36px;
      margin-right: 10px;
      place-items: center;
      border-radius: 13px;
      color: #2857df;
      background: #d9f4ef;
      font-size: 16px;
      font-weight: 900;
    }

    #user-tools,
    #user-tools a {
      color: #6b7890;
      font-weight: 700;
    }

    div.breadcrumbs {
      padding: 14px 34px;
      color: #6b7890;
      background: transparent;
      font-weight: 700;
    }

    #content {
      max-width: 1180px;
      margin: 20px auto 48px;
      padding: 0 24px;
    }

    #content h1 {
      margin: 0 0 22px;
      color: #20324d;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    #content-main {
      min-width: 0;
    }

    .module,
    #changelist,
    .login #content-main,
    .submit-row,
    fieldset.module {
      overflow: hidden;
      border: 1px solid rgba(232, 220, 200, 0.86);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 60px rgba(32, 50, 77, 0.08);
    }

    #changelist {
      border-radius: 24px;
    }

    .module h2,
    .module caption,
    .inline-group h2 {
      padding: 14px 18px;
      color: #20324d;
      background: #e7f7f4;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    table {
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid rgba(32, 50, 77, 0.08);
    }

    a:link,
    a:visited {
      color: #2857df;
      font-weight: 800;
    }

    input[type="submit"],
    button,
    .button,
    input[type="button"] {
      border-radius: 999px;
      padding: 10px 18px;
      box-shadow: 0 14px 30px rgba(40, 87, 223, 0.18);
      font-weight: 900;
    }

    input,
    textarea,
    select,
    .vTextField {
      border: 1px solid rgba(32, 50, 77, 0.14);
      border-radius: 14px;
      padding: 10px 12px;
      background: #fff;
    }

    .object-tools a,
    .object-tools a:link,
    .object-tools a:visited {
      border-radius: 999px;
      background: #0f766e;
      font-weight: 900;
    }

    .dashboard #content {
      max-width: 1220px;
    }

    .nufi-admin-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
      border: 1px solid rgba(40, 87, 223, 0.12);
      border-radius: 30px;
      padding: 28px;
      color: #fff;
      background:
        radial-gradient(circle at 92% 16%, rgba(217, 244, 239, 0.28), transparent 9rem),
        linear-gradient(145deg, #2857df 0%, #173fbd 55%, #132d78 100%);
      box-shadow: 0 30px 80px rgba(40, 87, 223, 0.22);
    }

    .nufi-admin-hero h1 {
      margin: 8px 0 10px;
      color: #fff !important;
    }

    .nufi-admin-hero p {
      max-width: 680px;
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 15px;
      line-height: 1.6;
    }

    .nufi-admin-kicker {
      display: inline-flex;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 7px 12px;
      color: #d9f4ef;
      background: rgba(255, 255, 255, 0.12);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nufi-admin-hero-card {
      min-width: 190px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.12);
    }

    .nufi-admin-hero-card span {
      display: block;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .nufi-admin-hero-card strong {
      display: block;
      margin-top: 8px;
      color: #fff;
      font-size: 24px;
      line-height: 1;
    }

    .nufi-admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .nufi-admin-app {
      overflow: hidden;
      border: 1px solid rgba(232, 220, 200, 0.86);
      border-radius: 26px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 24px 60px rgba(32, 50, 77, 0.08);
    }

    .nufi-admin-app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      background: #e7f7f4;
    }

    .nufi-admin-app-header h2 {
      margin: 0;
      color: #20324d;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .nufi-admin-count {
      display: inline-grid;
      min-width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 999px;
      color: #2857df;
      background: #fff;
      font-weight: 900;
    }

    .nufi-admin-models {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nufi-admin-models li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 18px;
      border-top: 1px solid rgba(32, 50, 77, 0.08);
    }

    .nufi-admin-models a {
      text-decoration: none;
    }

    .nufi-admin-model-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nufi-admin-model-actions a {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(231, 247, 244, 0.8);
      font-size: 12px;
      text-decoration: none;
    }

    @media (max-width: 800px) {
      #header {
        padding: 0 18px;
      }

      #content {
        padding: 0 14px;
      }

      .nufi-admin-hero {
        grid-template-columns: 1fr;
        padding: 22px;
      }
    }
  </style>
{% endblock %}

{% block branding %}
  <h1 id="site-name"><a href="{% url 'admin:index' %}">NUFI Admin Console</a></h1>
{% endblock %}

{% block nav-global %}{% endblock %}
