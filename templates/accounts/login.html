{% extends "base.html" %}

{% block title %}NUFI | Đăng nhập{% endblock %}

{% block content %}
  <section class="card auth-card">
    <h1>Đăng nhập</h1>
    <div class="auth-actions">
      <a class="button google" href="{% url 'google_login_start' %}">Tiếp tục với Google</a>
      <div class="divider">hoặc</div>
    </div>
    <form class="form" method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Đăng nhập</button>
    </form>
    <p>Chưa có tài khoản? <a href="{% url 'register' %}">Đăng ký tại đây</a>.</p>
  </section>
{% endblock %}
