<section class="theme-footer{% if extra_class %} {{ extra_class }}{% endif %}" aria-label="Tùy chỉnh màu giao diện">
  <div class="theme-footer-wrap">
    <strong class="theme-footer-title">
      <span class="theme-preview" aria-hidden="true"></span>
      <span>Màu giao diện</span>
    </strong>
    <div class="theme-options" role="list" aria-label="Danh sách màu giao diện">
      <button class="theme-option" type="button" data-theme-option data-theme-value="emerald" aria-label="Ngọc dịu" title="Ngọc dịu">
        <span class="theme-option-swatch theme-option-swatch-emerald" aria-hidden="true"></span>
        <span class="sr-only">Ngọc dịu</span>
      </button>
      <button class="theme-option" type="button" data-theme-option data-theme-value="ocean" aria-label="Xanh biển" title="Xanh biển">
        <span class="theme-option-swatch theme-option-swatch-ocean" aria-hidden="true"></span>
        <span class="sr-only">Xanh biển</span>
      </button>
      <button class="theme-option" type="button" data-theme-option data-theme-value="sunset" aria-label="Hoàng hôn" title="Hoàng hôn">
        <span class="theme-option-swatch theme-option-swatch-sunset" aria-hidden="true"></span>
        <span class="sr-only">Hoàng hôn</span>
      </button>
      <button class="theme-option" type="button" data-theme-option data-theme-value="terracotta" aria-label="Đất nung" title="Đất nung">
        <span class="theme-option-swatch theme-option-swatch-terracotta" aria-hidden="true"></span>
        <span class="sr-only">Đất nung</span>
      </button>
      <button class="theme-option" type="button" data-theme-option data-theme-value="blush" aria-label="Hồng phấn" title="Hồng phấn">
        <span class="theme-option-swatch theme-option-swatch-blush" aria-hidden="true"></span>
        <span class="sr-only">Hồng phấn</span>
      </button>
    </div>
  </div>
</section>
